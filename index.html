<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine</title>
  <style>
    :root{
      --bg1:#fff0f6;
      --bg2:#ffe4f1;
      --pink1:#ff4d8d;
      --pink2:#ff86b3;
      --pink3:#ffd1e3;
      --text:#1f1b24;
      --shadow: 0 18px 45px rgba(0,0,0,.12);
      --radius: 18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 20%, var(--bg2), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, #fff, transparent 55%),
        linear-gradient(180deg, var(--bg1), #fff);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:min(720px, 92vw);
      padding:42px 26px 28px;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(255, 105, 180, .18);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align:center;
      position:relative;
    }

    h1{
      margin:0 0 28px;
      font-size: clamp(24px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: .2px;
    }

    .btnRow{
      margin-top: 26px;
      display:flex;
      gap:16px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      border:0;
      cursor:pointer;
      border-radius: var(--radius);
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 700;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow: 0 10px 26px rgba(0,0,0,.12);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      min-width: 130px;
    }

    #yesBtn{
      background: linear-gradient(135deg, var(--pink1), var(--pink2));
      color:white;
    }
    #noBtn{
      background: white;
      color: var(--pink1);
      border: 2px solid rgba(255, 77, 141, .35);
      z-index: 20;
    }

    button:active{ transform: scale(.98); }
    button:focus{ outline: 3px solid rgba(255, 77, 141, .25); outline-offset: 3px; }

    /* Overlay for "YES" celebration */
    .overlay{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:0;
      transition: opacity .25s ease;
      background:
        radial-gradient(900px 700px at 50% 40%, rgba(255,77,141,.18), transparent 60%),
        radial-gradient(900px 700px at 50% 70%, rgba(255,134,179,.22), transparent 62%);
    }
    .overlay.on{ opacity:1; }

    .toast{
      position:fixed;
      left:50%;
      top:14%;
      transform: translateX(-50%) translateY(-10px);
      padding: 14px 18px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(255,77,141,.25);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
      font-weight: 800;
      color: var(--pink1);
      opacity:0;
      transition: opacity .25s ease, transform .25s ease;
      pointer-events:none;
      backdrop-filter: blur(10px);
      z-index: 60;
    }
    .toast.on{
      opacity:1;
      transform: translateX(-50%) translateY(0);
    }

    /* Confetti hearts */
    .heart{
      position:fixed;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%) rotate(45deg);
      border-radius: 4px;
      background: var(--pink1);
      box-shadow: 0 8px 18px rgba(255,77,141,.25);
      pointer-events:none;
      animation: floatUp var(--dur) ease-in forwards;
      opacity: .95;
    }
    .heart::before,
    .heart::after{
      content:"";
      position:absolute;
      width: 18px;
      height: 18px;
      background: inherit;
      border-radius: 50%;
    }
    .heart::before{ left:-9px; top:0; }
    .heart::after{ left:0; top:-9px; }

    @keyframes floatUp{
      0%   { transform: translate(-50%, -50%) rotate(45deg) scale(var(--s)); opacity: 0; }
      10%  { opacity: .95; }
      60%  { opacity: .95; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% - var(--dy))) rotate(45deg) scale(calc(var(--s) * 1.2)); opacity: 0; }
    }

    /* Fullscreen YES state (after 3 "NO" clicks) */
    .fullYes .wrap{ padding:0; }
    .fullYes .card{
      width:100vw;
      height:100vh;
      border-radius:0;
      padding: 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 14px;
      background: linear-gradient(135deg, #fff, var(--bg2));
      border:0;
      box-shadow:none;
    }
    .fullYes h1{
      margin: 0 0 10px;
      padding: 0 18px;
      position: relative;
      z-index: 30;
    }
    .fullYes .btnRow{ margin:0; }

    /* Ensure button can grow nicely */
    #yesBtn{
      transform-origin:center;
    }

    /* Nice subtle bounce on grow */
    .pop{
      animation: pop .22s ease-out;
    }
    @keyframes pop{
      0%{ transform: scale(1); }
      60%{ transform: scale(1.08); }
      100%{ transform: scale(1); }
    }

    .headlineReveal{
      animation: headlineReveal .45s ease both;
    }
    @keyframes headlineReveal{
      0%{ opacity: 0; transform: translateY(-10px) scale(.98); }
      100%{ opacity: 1; transform: translateY(0) scale(1); }
    }

    .cupid{
      position: fixed;
      top: 50%;
      width: clamp(66px, 9vw, 120px);
      height: auto;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      filter: drop-shadow(0 10px 18px rgba(255, 77, 141, .28));
      transition: opacity .35s ease;
    }
    .cupid-left{
      left: clamp(10px, 3vw, 34px);
      transform: translateY(-50%) translateX(-14px) scale(.9) scaleX(-1);
    }
    .cupid-right{
      right: clamp(10px, 3vw, 34px);
      transform: translateY(-50%) translateX(14px) scale(.9);
    }
    .cupid img{
      display: block;
      width: 100%;
      height: auto;
    }
    .cupidsOn .cupid-left{
      opacity: 1;
      animation: cupidEnterLeft .55s ease both, cupidFloat 2.8s ease-in-out .55s infinite;
    }
    .cupidsOn .cupid-right{
      opacity: 1;
      animation: cupidEnterRight .55s ease both, cupidFloat 2.8s ease-in-out .65s infinite;
    }
    @keyframes cupidEnterLeft{
      0%{ transform: translateY(-50%) translateX(-26px) scale(.7) scaleX(-1); opacity: 0; }
      100%{ transform: translateY(-50%) translateX(0) scale(1) scaleX(-1); opacity: 1; }
    }
    @keyframes cupidEnterRight{
      0%{ transform: translateY(-50%) translateX(26px) scale(.7); opacity: 0; }
      100%{ transform: translateY(-50%) translateX(0) scale(1); opacity: 1; }
    }
    @keyframes cupidFloat{
      0%{ margin-top: 0; }
      50%{ margin-top: -10px; }
      100%{ margin-top: 0; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast">Урааа! 💗</div>
  <div class="cupid cupid-left" aria-hidden="true">
    <img src="free-icon-cupid-17154890.svg" alt="" />
  </div>
  <div class="cupid cupid-right" aria-hidden="true">
    <img src="free-icon-cupid-17154890.svg" alt="" />
  </div>

  <div class="wrap">
    <div class="card" id="card">
      <h1 id="question">Будешь ли моей валентинкой?</h1>

      <div class="btnRow" id="btnRow">
        <button id="yesBtn" type="button">ДА</button>
        <button id="noBtn" type="button">НЕТ</button>
      </div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn  = document.getElementById('noBtn');
    const overlay = document.getElementById('overlay');
    const toast = document.getElementById('toast');
    const question = document.getElementById('question');
    const card = document.getElementById('card');

    let noClicks = 0;
    let isFullscreenYes = false;
    let isOfficial = false;
    let trackStarted = false;

    // Simple sound effects via Web Audio API (no external audio files)
    let audioCtx = null;
    const loveTrack = new Audio(encodeURI('Пицца - Лифт.mp3'));
    loveTrack.preload = 'auto';

    function ensureAudio(){
      if (!audioCtx){
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, duration = 0.12, type = 'sine', volume = 0.06, delay = 0){
      const ctx = ensureAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = ctx.currentTime + delay;
      const end = start + duration;

      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(end + 0.02);
    }

    function playNoSound(){
      tone(220, 0.09, 'triangle', 0.05, 0);
      tone(185, 0.11, 'triangle', 0.045, 0.08);
    }

    function playYesSound(){
      // Soft romantic arpeggio
      tone(392.0, 0.2, 'triangle', 0.035, 0.00);   // G4
      tone(493.88, 0.22, 'sine', 0.03, 0.10);       // B4
      tone(587.33, 0.24, 'sine', 0.03, 0.22);       // D5
      tone(783.99, 0.28, 'triangle', 0.03, 0.34);   // G5
      tone(698.46, 0.24, 'sine', 0.026, 0.50);      // F5
      tone(587.33, 0.26, 'sine', 0.025, 0.62);      // D5
    }

    function playCelebrateSound(){
      // Warm glitter-like flourish
      tone(523.25, 0.14, 'sine', 0.028, 0.00);      // C5
      tone(659.25, 0.14, 'sine', 0.028, 0.08);      // E5
      tone(783.99, 0.16, 'triangle', 0.026, 0.16);  // G5
      tone(1046.5, 0.2, 'sine', 0.022, 0.24);       // C6
    }

    // Visual scale factors
    let yesScale = 1;
    let noScale  = 1;

    function setButtonScales(){
      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform  = `scale(${noScale})`;
    }

    function pop(el){
      el.classList.remove('pop');
      // force reflow
      void el.offsetWidth;
      el.classList.add('pop');
    }

    function moveNoRandom(){
      const rect = noBtn.getBoundingClientRect();
      const w = rect.width || noBtn.offsetWidth || 130;
      const h = rect.height || noBtn.offsetHeight || 52;
      const viewW = document.documentElement.clientWidth || window.innerWidth;
      const viewH = document.documentElement.clientHeight || window.innerHeight;
      const pad = 10;
      const minX = pad;
      const minY = pad;
      const maxX = Math.max(pad, viewW - w - pad);
      const maxY = Math.max(pad, viewH - h - pad);
      const yesRect = yesBtn.getBoundingClientRect();
      const safety = 10;
      let x = minX;
      let y = minY;
      let found = false;

      for(let i = 0; i < 28; i++){
        const cx = minX + Math.random() * Math.max(1, maxX - minX);
        const cy = minY + Math.random() * Math.max(1, maxY - minY);
        const overlapsYes =
          cx < (yesRect.right + safety) &&
          (cx + w) > (yesRect.left - safety) &&
          cy < (yesRect.bottom + safety) &&
          (cy + h) > (yesRect.top - safety);
        if (!overlapsYes){
          x = cx;
          y = cy;
          found = true;
          break;
        }
      }

      // If every random position overlaps YES, place NO in a safe corner.
      if (!found){
        const cornerX = [minX, maxX];
        const cornerY = [minY, maxY];
        let best = { x:minX, y:minY, d:-1 };
        for (const cx of cornerX){
          for (const cy of cornerY){
            const dx = cx - yesRect.left;
            const dy = cy - yesRect.top;
            const d = dx*dx + dy*dy;
            if (d > best.d) best = { x:cx, y:cy, d };
          }
        }
        x = best.x;
        y = best.y;
      }

      // Final hard clamp in case of mobile viewport quirks.
      x = Math.max(minX, Math.min(x, maxX));
      y = Math.max(minY, Math.min(y, maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.right = 'auto';
      noBtn.style.bottom = 'auto';
      noBtn.style.display = 'inline-block';
      noBtn.style.visibility = 'visible';
      noBtn.style.pointerEvents = 'auto';
      noBtn.style.opacity = '1';
      noBtn.style.transition = 'left .22s ease, top .22s ease, opacity .18s ease, transform .18s ease';

      // Extra safety clamp using rendered rect to prevent any overflow on mobile.
      keepNoInViewport();
    }

    function keepNoInViewport(){
      if (noBtn.style.display === 'none') return;
      const pad = 10;
      const viewW = document.documentElement.clientWidth || window.innerWidth;
      const viewH = document.documentElement.clientHeight || window.innerHeight;
      const r = noBtn.getBoundingClientRect();
      const bw = r.width || noBtn.offsetWidth || 130;
      const bh = r.height || noBtn.offsetHeight || 52;
      const minX = pad;
      const minY = pad;
      const maxX = Math.max(minX, viewW - bw - pad);
      const maxY = Math.max(minY, viewH - bh - pad);
      let left = parseFloat(noBtn.style.left || `${r.left}`);
      let top = parseFloat(noBtn.style.top || `${r.top}`);

      if (r.left < pad) left += (pad - r.left);
      if (r.right > viewW - pad) left -= (r.right - (viewW - pad));
      if (r.top < pad) top += (pad - r.top);
      if (r.bottom > viewH - pad) top -= (r.bottom - (viewH - pad));

      left = Math.max(minX, Math.min(left, maxX));
      top = Math.max(minY, Math.min(top, maxY));
      noBtn.style.left = `${left}px`;
      noBtn.style.top = `${top}px`;
    }

    function celebratePink(){
      overlay.classList.add('on');
      toast.classList.add('on');
      playCelebrateSound();

      const count = 42;
      for(let i=0;i<count;i++){
        const h = document.createElement('div');
        h.className = 'heart';

        const x = Math.random() * window.innerWidth;
        const y = window.innerHeight * (0.65 + Math.random()*0.25);

        const dx = (Math.random()*2 - 1) * 220;   // sideways drift
        const dy = 260 + Math.random()*520;        // how far it flies up
        const s  = 0.7 + Math.random()*1.25;       // size
        const dur = 900 + Math.random()*900;

        // random pink shades
        const shades = ['#ff4d8d', '#ff86b3', '#ffb3d1', '#ff2f78', '#ff6aa6'];
        h.style.background = shades[(Math.random()*shades.length)|0];

        h.style.left = `${x}px`;
        h.style.top  = `${y}px`;
        h.style.setProperty('--dx', `${dx}px`);
        h.style.setProperty('--dy', `${dy}px`);
        h.style.setProperty('--s',  `${s}`);
        h.style.setProperty('--dur', `${dur}ms`);

        document.body.appendChild(h);
        h.addEventListener('animationend', () => h.remove(), { once:true });
      }

      // auto-hide overlay/toast
      clearTimeout(celebratePink._t1);
      clearTimeout(celebratePink._t2);
      celebratePink._t1 = setTimeout(() => overlay.classList.remove('on'), 1100);
      celebratePink._t2 = setTimeout(() => toast.classList.remove('on'), 1500);
    }

    function makeYesFullscreen(){
      isFullscreenYes = true;
      document.body.classList.add('fullYes');
      // Reset any accumulated button scaling so it doesn't cover the heading.
      yesScale = 1;
      noScale = 1;
      yesBtn.style.transform = 'scale(1)';
      // Make YES button fill screen width/height nicely
      yesBtn.style.width = 'min(760px, 88vw)';
      yesBtn.style.height = 'min(200px, 20vh)';
      yesBtn.style.fontSize = 'clamp(28px, 5vw, 64px)';
      yesBtn.style.borderRadius = '26px';

      // Keep original heading until user confirms with YES
      question.textContent = 'Будешь ли моей валентинкой?';
      celebratePink();
    }

    function revealOfficialTitle(){
      if (isOfficial) return;
      isOfficial = true;
      question.textContent = 'Тогда это официально 💗';
      question.style.opacity = '1';
      question.classList.remove('headlineReveal');
      void question.offsetWidth;
      question.classList.add('headlineReveal');
      document.body.classList.add('cupidsOn');
    }

    yesBtn.addEventListener('click', () => {
      // If we're already in fullscreen state, still celebrate
      playYesSound();
      celebratePink();
      revealOfficialTitle();
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';
      noBtn.style.display = 'none';
      if (!trackStarted){
        loveTrack.currentTime = 23;
        loveTrack.play().then(() => {
          trackStarted = true;
        }).catch(() => {
          // Ignore play interruption errors (browser policies/network hiccups).
        });
      }
      if (!isFullscreenYes) pop(yesBtn);
    });

    noBtn.addEventListener('click', () => {
      playNoSound();
      noClicks += 1;

      // Growth/shrink each cycle
      yesScale = Math.min(yesScale + 0.22, 6);
      noScale  = Math.max(noScale - 0.14, 0.72);
      setButtonScales();
      pop(yesBtn);
      moveNoRandom();

      if (noClicks === 4){
        // 4th click: NO disappears, YES goes fullscreen
        noBtn.style.opacity = '0';
        noBtn.style.pointerEvents = 'none';
        setTimeout(() => {
          noBtn.style.display = 'none';
          makeYesFullscreen();
        }, 180);
      }
    });

    // initial
    setButtonScales();
    window.addEventListener('resize', keepNoInViewport);
    window.addEventListener('orientationchange', keepNoInViewport);
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', keepNoInViewport);
    }
  </script>
</body>
</html>
